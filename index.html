<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Resolve before the first paint, including when storage is unavailable.
      (() => {
        let preference;
        try {
          preference = localStorage.getItem('devloom.theme');
        } catch {}
        const theme =
          preference === 'light' || preference === 'dark'
            ? preference
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#181818' : '#ffffff';
      })();
    </script>
    <meta
      name="description"
      content="Devloom — a local control panel for your development services, processes, health checks, and live logs."
    />
    <link rel="icon" type="image/svg+xml" href="/brand/devloom-mark.svg" />
    <title>Devloom · Local workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
