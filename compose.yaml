services:
  devloom:
    build: .
    image: devloom:local
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      DEVLOOM_HOST: 0.0.0.0
      DEVLOOM_PORT: ${DEVLOOM_PORT:-4310}
      DEVLOOM_OTLP_PORT: ${DEVLOOM_OTLP_PORT:-4318}
      DEVLOOM_DATA_DIR: /data
    ports:
      - '127.0.0.1:${DEVLOOM_PORT:-4310}:${DEVLOOM_PORT:-4310}'
      - '127.0.0.1:${DEVLOOM_OTLP_PORT:-4318}:${DEVLOOM_OTLP_PORT:-4318}'
    volumes:
      - devloom-data:/data

volumes:
  devloom-data:
