name: Feature request
description: Suggest a practical improvement to the local development workspace.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What development problem would this solve?
      description: Describe your workflow and current workaround.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what a developer should be able to do. A small example or sketch helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention other approaches or existing tools you tried.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This request supports local development and fits Devloom's purpose.
          required: true
        - label: I searched existing requests for the same idea.
          required: true
